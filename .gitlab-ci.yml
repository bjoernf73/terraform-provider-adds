stages:
  - build
  - test
  - e2e

variables:
  GO_IMAGE: "golang:1.26"
  TF_IMAGE: "hashicorp/terraform:1.13"
  PROVIDER_NAMESPACE: "bjoernf73"
  PROVIDER_TYPE: "adlc"
  PROVIDER_VERSION: "0.0.0-ci"
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOTOOLCHAIN: "local"

.go_cache: &go_cache
  key:
    files:
      - go.sum
  paths:
    - .go/pkg/mod

build:
  stage: build
  image: $GO_IMAGE
  tags:
    - kubernetes
  cache: *go_cache
  script:
    - test -z "$(gofmt -l main.go internal)" || { echo 'gofmt issues:'; gofmt -l main.go internal; exit 1; }
    - go vet ./...
    - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/terraform-provider-adlc_v${PROVIDER_VERSION} .
    - GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o dist/terraform-provider-adlc_v${PROVIDER_VERSION}.exe .
  artifacts:
    expire_in: 1 week
    paths:
      - dist/

unit:
  stage: test
  image: $GO_IMAGE
  tags:
    - kubernetes
  cache: *go_cache
  script:
    - go test ./...

.e2e_template:
  stage: e2e
  # Serialize every DC-touching job (winrm, ssh, winrm-https) against the single test DC:
  # concurrent applies on one box contend on LSASS/WinRM/sshd/GroupPolicy and inflate SSH
  # timings (Import-GPO can exceed timeout_seconds). resource_group runs them one at a time
  # project-wide while leaving build/lint/test free to parallelize.
  resource_group: dc
  image:
    name: $TF_IMAGE
    entrypoint: [""]
  tags:
    - kubernetes
  needs:
    - job: build
      artifacts: true
  variables:
    TF_IN_AUTOMATION: "1"
    TF_INPUT: "0"
    TF_CLI_CONFIG_FILE: "$CI_PROJECT_DIR/.ci.tfrc"
    TF_VAR_host: "$ADLC_HOST"
  before_script:
    - MIRROR="$CI_PROJECT_DIR/.provider-mirror/registry.terraform.io/${PROVIDER_NAMESPACE}/${PROVIDER_TYPE}/${PROVIDER_VERSION}/linux_amd64"
    - mkdir -p "$MIRROR"
    - install -m 0755 "dist/terraform-provider-adlc_v${PROVIDER_VERSION}" "$MIRROR/terraform-provider-adlc_v${PROVIDER_VERSION}"
    - |
      cat > "$TF_CLI_CONFIG_FILE" <<EOF
      provider_installation {
        filesystem_mirror {
          path    = "$CI_PROJECT_DIR/.provider-mirror"
          include = ["registry.terraform.io/${PROVIDER_NAMESPACE}/${PROVIDER_TYPE}"]
        }
        direct {
          exclude = ["registry.terraform.io/${PROVIDER_NAMESPACE}/${PROVIDER_TYPE}"]
        }
      }
      EOF
  script:
    - cd test/e2e
    - terraform fmt -check -recursive
    - terraform init 
    - terraform validate 
    - terraform apply -auto-approve 
    # Update path: change a reconcilable attribute and convert the group's scope. Flipping
    # Global -> DomainLocal exercises the two-step conversion through Universal.
    - TF_VAR_ou_description="updated by pipeline ${CI_PIPELINE_ID}" TF_VAR_group_scope="DomainLocal" terraform apply -auto-approve 
    # Idempotency: a second plan must produce no changes (exit code 0).
    - TF_VAR_ou_description="updated by pipeline ${CI_PIPELINE_ID}" TF_VAR_group_scope="DomainLocal" terraform plan -detailed-exitcode 
  after_script:
    - cd test/e2e && terraform destroy -auto-approve  || true

# Windows shell-executor variant of .e2e_template. A shell runner ignores `image`, cannot run
# the bash before_script, and needs the windows_amd64 provider build, so the mirror staging and
# the .ci.tfrc are rewritten in PowerShell. Isolated in its own resource_group so it serializes
# against its own target host without blocking the kubernetes DC jobs.
.e2e_windows_template:
  stage: e2e
  resource_group: dc-win
  tags:
    - win
  needs:
    - job: build
      artifacts: true
  variables:
    TF_IN_AUTOMATION: "1"
    TF_INPUT: "0"
    TF_CLI_CONFIG_FILE: "$CI_PROJECT_DIR/.ci.tfrc"
    # Persistent local state/plan on the self-hosted runner, reused across pipeline runs.
    TF_STATE_DIR: 'C:\tftest'
  before_script:
    - |
      $ErrorActionPreference = 'Stop'
      New-Item -ItemType Directory -Force -Path $env:TF_STATE_DIR | Out-Null
      # Stage the provider mirror OUTSIDE the Git working tree. This persistent shell runner
      # runs `git clean -ffdx` between runs; when the mirror lived under $CI_PROJECT_DIR the
      # clean choked trying to delete the locked provider .exe ("failed to remove ... Invalid
      # argument"), failing the checkout before the script ran. Keeping it next to the reused
      # state under $TF_STATE_DIR keeps it off the churned repo entirely.
      $mirrorRoot = Join-Path $env:TF_STATE_DIR '.provider-mirror'
      $ns = $env:PROVIDER_NAMESPACE
      $type = $env:PROVIDER_TYPE
      $mirror = Join-Path $mirrorRoot "registry.terraform.io\$ns\$type\$($env:PROVIDER_VERSION)\windows_amd64"
      New-Item -ItemType Directory -Force -Path $mirror | Out-Null
      $exe = "terraform-provider-adlc_v$($env:PROVIDER_VERSION).exe"
      Copy-Item "dist\$exe" (Join-Path $mirror $exe) -Force
      $mirrorFwd = $mirrorRoot -replace '\\','/'
      $tfrc = @(
        'provider_installation {'
        '  filesystem_mirror {'
        "    path    = `"$mirrorFwd`""
        "    include = [`"registry.terraform.io/$ns/$type`"]"
        '  }'
        '  direct {'
        "    exclude = [`"registry.terraform.io/$ns/$type`"]"
        '  }'
        '}'
      )
      Set-Content -Path $env:TF_CLI_CONFIG_FILE -Value $tfrc -Encoding ascii

e2e:winrm:
  extends: .e2e_template
  variables:
    TF_VAR_transport: "winrm"
    TF_VAR_username: "$ADLC_USERNAME"
    TF_VAR_password: "$ADLC_PASSWORD"
    TF_VAR_ou_path: "TerraformCI/pipeline-$CI_PIPELINE_ID-winrm"
    TF_VAR_group_name: "adlc-ci-$CI_PIPELINE_ID-winrm"
  rules:
    # Required CI/CD variables: ADLC_HOST, ADLC_USERNAME, ADLC_PASSWORD (masked).
    # Optional overrides are set directly as TF_VAR_port / TF_VAR_winrm_auth /
    # TF_VAR_winrm_use_tls / TF_VAR_insecure CI/CD variables.
    - if: '$ADLC_HOST == null || $ADLC_HOST == ""'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: manual
      allow_failure: true

e2e:ssh:
  extends: .e2e_template
  variables:
    TF_VAR_transport: "ssh"
    TF_VAR_username: "$ADLC_USERNAME"
    TF_VAR_password: "$ADLC_PASSWORD"
    TF_VAR_ou_path: "TerraformCI/pipeline-$CI_PIPELINE_ID-ssh"
    TF_VAR_group_name: "adlc-ci-$CI_PIPELINE_ID-ssh"    # No known_hosts entry for the target, so host key verification is disabled here.
    # Set ssh_known_hosts_path or ssh_host_key to turn it back on.
    TF_VAR_insecure: "true"  
  rules:
    # Requires ADLC_SSH_USERNAME and ADLC_SSH_PASSWORD (masked) in addition to ADLC_HOST.
    - if: '$ADLC_HOST == null || $ADLC_HOST == ""'
      when: never
    - if: '$ADLC_PASSWORD == null || $ADLC_PASSWORD == ""'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: manual
      allow_failure: true

# Applies a fixed-name configuration over WinRM/HTTPS with every property populated, and
# deliberately leaves the objects in place so they can be inspected in ADUC. The state is
# discarded with the job; the next run reconciles the same objects rather than creating
# new ones, because every ensure script is idempotent.
e2e:winrm-https:
  extends: .e2e_template
  variables:
    TF_VAR_username: "$ADLC_USERNAME"
    TF_VAR_password: "$ADLC_PASSWORD"
  rules:
    # Requires an HTTPS listener on 5986; opt in with ADLC_WINRM_HTTPS=true.
    # Certificate validation is on by default: set TF_VAR_insecure=true if the
    # listener uses a self-signed certificate.
    - if: '$ADLC_HOST == null || $ADLC_HOST == ""'
      when: never
    - if: '$ADLC_WINRM_HTTPS != "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: manual
      allow_failure: true
  script:
    - cd test/showcase
    - terraform fmt -check -recursive
    - terraform init 
    - terraform validate 
    - terraform apply -auto-approve 
    # Idempotency: re-applying the same configuration must produce no changes.
    - terraform plan -detailed-exitcode 
    - terraform output -json | tee "$CI_PROJECT_DIR/showcase-outputs.json"
  after_script:
    - echo "Showcase objects left in place for inspection."
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - showcase-outputs.json

# Same showcase as e2e:winrm-https, but applied from a self-hosted Windows runner (tag `win`)
# against a second host, to prove the Windows-built provider works end to end.
e2e:winrm-https2:
  extends: .e2e_windows_template
  variables:
    TF_VAR_username: "$ADLC_USERNAME2"
    TF_VAR_password: "$ADLC_PASSWORD2"
    TF_VAR_host: "$ADLC_HOST2"
  rules:
    # Requires an HTTPS listener on 5986; opt in with ADLC_WINRM_HTTPS=true.
    # Certificate validation is on by default: set TF_VAR_insecure=true if the
    # listener uses a self-signed certificate.
    - if: '$ADLC_HOST2 == null || $ADLC_HOST2 == ""'
      when: never
    - if: '$ADLC_WINRM_HTTPS != "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: manual
      allow_failure: true
  script:
    - cd test/showcase
    - terraform init
    - terraform validate
    - terraform apply -auto-approve -state="$env:TF_STATE_DIR\showcase.tfstate"
    # Idempotency: re-applying must produce no changes. State is reused across runs and the
    # plan file is kept on the runner next to it.
    - terraform plan -detailed-exitcode -state="$env:TF_STATE_DIR\showcase.tfstate" -out="$env:TF_STATE_DIR\showcase.tfplan"
    - terraform output -json -state="$env:TF_STATE_DIR\showcase.tfstate" | Out-File -FilePath "$env:CI_PROJECT_DIR/showcase-outputs2.json" -Encoding ascii
  after_script:
    - echo "Showcase objects left in place for inspection."
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - showcase-outputs2.json

  #     fail-fast: false
  #     matrix:
  #       terraform:
  #         - '1.0.*'
  #         - '1.1.*'
  #         - '1.2.*'
  #         - '1.3.*'
  #         - '1.4.*'
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #     - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
